<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 191" width="1128" height="191" role="img" aria-label="Audiris. Born in QA. Built for everything that comes after.">
  <!--
    LinkedIn company cover, 1128 x 191.
    The rings are the site's iris diagram, centred on the bottom-left corner where LinkedIn
    places the company logo, so the logo tile stands in for the diagram's QA core.
    Keep text out of the lower-left corner (roughly x under 290, y over 70): the logo covers it,
    and covers more of it on mobile.
  -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&amp;family=Instrument+Sans:wght@500&amp;display=block');
    .tagline {
      font-family: 'Bricolage Grotesque', system-ui, sans-serif;
      font-size: 42px;
      font-weight: 600;
      letter-spacing: -0.03em;
      fill: #1E2329;
    }
    .label {
      font-family: 'Instrument Sans', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
      fill: #1E2329;
      /* Field-coloured halo keeps a label legible if it ever touches the next ring. */
      paint-order: stroke;
      stroke: #F4F6F8;
      stroke-width: 6px;
      stroke-linejoin: round;
    }
  </style>

  <rect width="1128" height="191" fill="#F4F6F8"/>

  <!-- Rings: Automation Testing, Software Development, Outsourcing -->
  <g fill="none" stroke-width="2">
    <circle cx="88" cy="191" r="215" stroke="#3D3A9E"/>
    <circle cx="88" cy="191" r="365" stroke="#A29FDB"/>
    <circle cx="88" cy="191" r="535" stroke="#8A93A0"/>
  </g>

  <!-- Label dots sit on their ring; labels start 14px to the right, as on the site. -->
  <circle cx="287.6" cy="111" r="5" fill="#3D3A9E"/>
  <text class="label" x="301.6" y="116">Automation Testing</text>

  <circle cx="433.1" cy="72" r="5" fill="#A29FDB"/>
  <text class="label" x="447.1" y="77">Software Development</text>

  <circle cx="600.4" cy="37" r="5" fill="#8A93A0"/>
  <text class="label" x="614.4" y="42">Outsourcing</text>

  <text class="tagline">
    <tspan x="722" y="66">Born in QA.</tspan>
    <tspan x="722" y="110">Built for everything</tspan>
    <tspan x="722" y="154">that comes after.</tspan>
  </text>
</svg>
